# Kit Lab Nginx 反向代理样例
# 使用方法：修改 server_name 为实际域名，放入 /etc/nginx/sites-available/ 并软链到 sites-enabled/，
# sudo nginx -t 检查通过后 sudo systemctl reload nginx。

server {
    listen 80;
    server_name kit.example.com;

    # HTML/ZIP 采用流式上传；关闭代理缓冲可避免 Nginx 再落一份临时大文件。
    location = /api/html-tools/upload {
        client_max_body_size 1g;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 用户 HTML 内容使用独立站点，避免用户脚本与 Kit Lab 登录态同源。
# 同时在 .env 中设置 HTML_TOOL_PUBLIC_ORIGIN=https://tools.example.com。
server {
    listen 80;
    server_name tools.example.com;

    location ^~ /api/html-tools/content/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
    }

    # 工具页面注入的跨域代理补丁会调用该接口，需与内容同样放行并剥离登录态。
    location ^~ /api/html-tools/proxy {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
    }

    location / {
        return 404;
    }
}
